spring.application.name=grocery-backend
server.port=${PORT:7777}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=postgres
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ---- JWT ----
# Required. Generate one long random value, e.g.: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:8640000000}

# ---- The two accounts ----
# Seeded into the users table on first startup only (see DataSeeder).
app.seed.user1.username=${SEED_USER1_USERNAME:vedant}
app.seed.user1.password=${SEED_USER1_PASSWORD}
app.seed.user2.username=${SEED_USER2_USERNAME:family}
app.seed.user2.password=${SEED_USER2_PASSWORD}


whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}


spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.sendEmail=${SEND_EMAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
